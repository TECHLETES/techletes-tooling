[project]
name = "engineering-cockpit"
version = "0.1.0"
description = "Techletes Engineering Cockpit control plane for local Codex development tasks."
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Thom Ezechiels", email = "thom@techletes.ai" }]
maintainers = [{ name = "Techletes DevOps Team", email = "dev@techletes.ai" }]
keywords = ["fastapi", "codex", "engineering", "python", "react", "sqlmodel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "alembic>=1.18.4,<2.0.0",
  "boto3>=1.35.0,<2.0.0",
  "chardet>=7.0.0,<8.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "emails>=0.6,<1.0.0",
  "fastapi[standard]>=0.133.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "mako>=1.3.12,<2.0.0",
  "psycopg[binary]>=3.3.3,<4.0.0",
  "pwdlib[argon2,bcrypt]>=0.3.0,<1.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "pydantic-settings>=2.13.1,<3.0.0",
  "pyjwt>=2.12.0,<3.0.0",
  "python-multipart>=0.0.27,<1.0.0",
  "redis>=7.0.0,<8.0.0",
  "requests>=2.33.0,<3.0.0",
  "rq>=2.0.0,<3.0.0",
  "sentry-sdk[fastapi]>=2.53.0,<3.0.0",
  "sqlmodel>=0.0.37,<1.0.0",
  "tenacity>=9.1.4,<10.0.0",
  "urllib3>=2.7.0,<3.0.0",
  "idna>=3.15,<4.0.0",
  "cryptography>=49.0.0,<50.0.0"
]

[project.urls]
Homepage = "https://github.com/TECHLETES/techletes-tooling/tree/main/apps/engineering-cockpit"
Issues = "https://github.com/TECHLETES/techletes-tooling/issues/7"
Repository = "https://github.com/TECHLETES/techletes-tooling"

[dependency-groups]
dev = [
  "bandit>=1.7.0,<2.0.0",
  "black>=26.3.1,<27.0.0",
  "build>=0.11.0",
  "codespell>=2.2.0,<3.0.0",
  "detect-secrets>=1.5.0,<2.0.0",
  "fakeredis>=2.28.0",
  "genbadge[coverage]>=1.1.0,<2.0.0",
  "ipykernel>=6.29.0,<7.0.0",
  "mypy>=1.19.0,<2.0.0",
  "nbstripout>=0.8.0,<1.0.0",
  "pillow>=12.2.0,<13.0.0",
  "pip-audit>=2.10.0,<3.0.0",
  "pre-commit>=4.5.0,<5.0.0",
  "prek>=0.2.24,<1.0.0",
  "pydocstyle>=6.3.0,<7.0.0",
  "pygments>=2.20.0,<3.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "pyupgrade>=3.15.0,<4.0.0",
  "rich>=14.2.0,<15.0.0",
  "ruff>=0.14.0,<1.0.0",
  "testcontainers>=4.8.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.bandit]
exclude_dirs = ["backend/tests", "frontend", ".venv"]
skips = ["B101", "B601"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.coverage.run]
source = ["backend"]
omit = [
  "*/__pycache__/*",
  "*/tests/*",
  "*/migrations/*",
  "*/.venv/*",
  "*/venv/*",
  "*/__init__.py",
  "setup.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "except ImportError",
  "pass",
]

[tool.mypy]
python_version = "3.12"

# ignore_missing_imports for third-party libs without type hints
ignore_missing_imports = true
follow_imports = "silent"

# strictness settings - adjust as needed
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
allow_redefinition = true
show_column_numbers = true
pretty = true
warn_unused_configs = true

# enforce typing on own code
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Let mypy discover backend code recursively and exclude non-source paths here.
files = ["backend"]
exclude = '''
(?x)(
    ^backend/alembic/
  | ^backend/migrations/
  | ^backend/tests/
)
'''
plugins = []

[tool.pip-audit]
# Centralized CVE/PYSEC exclusions for pip-audit
# Used by both pre-commit hooks and CI workflows via scripts/hooks/run-pip-audit.sh
# See docs/6_pre_commit_troubleshooting.md for explanation of each exclusion
ignore = [
]

[tool.pydocstyle]
match-dir = "^(?!tests$|migrations$|alembic$).*"

[tool.pytest]
addopts = [
  "-n",
  "auto",
  "--dist=loadfile",
  "--cov-report=html",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov=backend",
  "--strict-config",
  "--strict-markers",
]
minversion = "9.0.3"
markers = [
  "unit: fast tests that do not require external services",
  "db: tests that exercise the database and CRUD layer",
  "api: HTTP route and API integration tests",
  "integration: end-to-end backend tests",
  "slow: long-running or heavy tests",
]
python_classes = ["Test*"]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
respect-gitignore = true
extend-exclude = ["migrations", "tests", "alembic", "venv", ".venv"]
lint.dummy-variable-rgx = "^_|^__|^pytest$"

# Enable popular rule sets
lint.select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # import sorting
  "B",  # bugbear
  "UP",  # pyupgrade
]

# Rules to ignore (common ones)
lint.ignore = [
  "B008",  # Do not perform function calls in argument defaults
  "E501",  # Line too long (Black handles this)
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["*"]
exclude = ["tests*"]

[tool.detect-secrets]
# Regular expressions matched against paths ignored by the shared helper and
# the pre-commit detect-secrets check.
exclude_files = [
  "^coverage.svg$",
  "^tests/",
  "frontend/src/@types/i18next-resources.d",
  "^frontend/src/locales/",
  "^backend/alembic/versions/"
]

[tool.uv]
required-version = ">=0.9.25,<1.0.0"
