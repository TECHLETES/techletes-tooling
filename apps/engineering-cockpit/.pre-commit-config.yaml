repos:
  - repo: local
    hooks:
      # Validate branch name follows naming convention
      - id: validate-branch-name
        name: Validate branch name format
        entry: bash scripts/hooks/validate-branch-name.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # Strip notebook outputs
      - id: nbstripout-autoadd
        name: nbstripout (auto-add notebooks)
        entry: uv run scripts/hooks/nbstripout-autoadd.sh
        language: system
        always_run: true
        pass_filenames: false

    # Python formatter
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Black (python formatter)
        language_version: python3.12
        types: [python]

  # General-purpose pre-commit hooks for various file types
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-json
        exclude: openapi.json
      - id: check-symlinks
      - id: check-added-large-files
        exclude: graphify-out/|frontend/public/assets/images/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              frontend/src/client/.*|
              backend/email-templates/build/.*|
              coverage\.svg
          )$
      - id: trailing-whitespace
        exclude: ^frontend/src/client/.*|coverage\.svg$

  # Dependency vulnerability scanning with uv.lock
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        args: ["--progress-spinner", "off", "--desc"]
        entry: uv run bash scripts/hooks/run-pip-audit.sh
        language: system
        stages: [pre-commit]

  # Secrets scanning. Keep exclusions in pyproject.toml so the manual helper
  # and pre-commit use the same path rules.
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets (shared helper)
        entry: bash scripts/hooks/run-detect-secrets.sh --pre-commit
        language: system
        pass_filenames: true

  # Notebook/text sync with jupytext
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.5
    hooks:
      - id: jupytext
        args: [--sync]
        require_serial: true

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: Type check with mypy
        args:
          [
            "--config-file=pyproject.toml",
            "--install-types",
            "--non-interactive",
          ]
        pass_filenames: false

  # Modernize Python syntax
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: pyupgrade (modernize Python syntax)
        args: [--py312-plus]
        types: [python]

  # Linting and formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: Ruff (linting + import sorting + formatting)
        args: [--fix]
        types: [python]

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (security check)
        args: [-ll, --skip, B101]
        exclude: ^tests/
        types: [python]

  # Docstring validation
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstring validation)
        exclude: ^(backend/tests/|backend/alembic/|backend/migrations/|tests/|alembic/|migrations/|example/)
        types: [python]

  - repo: local
    hooks:
      # Custom hook to run Biome linting on the frontend codebase
      - id: local-biome-check
        name: biome check
        entry: bash -lc 'cd frontend && bun run lint && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-i18n-check
        name: frontend i18n check
        entry: bash ./scripts/hooks/check-frontend-translations.sh
        language: system
        pass_filenames: false
        files: ^frontend/(src/.*|i18next\.config\.ts|package\.json)$

      # Custom hook generate the frontend SDK whenever relevant backend code or the generation script itself changes
      - id: generate-frontend-sdk
        name: Generate Frontend SDK
        entry: bash ./scripts/generate-client.sh
        pass_filenames: false
        language: system
        files: ^backend/.*$|^scripts/generate-client\.sh$
