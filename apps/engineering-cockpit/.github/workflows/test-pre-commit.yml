name: Test Pre-commit

on:
  workflow_dispatch: {}
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
      PROJECT_NAME: "Full Stack Template"
      SECRET_KEY: "test-secret-key-for-ci-only" # pragma: allowlist secret
      FRONTEND_HOST: "http://localhost:5173"
      POSTGRES_SERVER: "localhost"
      POSTGRES_DB: "app"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "testpassword" # pragma: allowlist secret
      REDIS_URL: "redis://localhost:6379"
      FIRST_SUPERUSER: "admin@example.com"
      FIRST_SUPERUSER_PASSWORD: "testpassword" # pragma: allowlist secret
      EMAILS_FROM_EMAIL: "test@example.com"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Cache frontend dependencies
        uses: actions/cache@v4.2.0
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun ci
        working-directory: frontend

      - name: Cache pre-commit hooks
        uses: actions/cache@v4.2.0
        with:
          path: ${{ github.workspace }}/.pre-commit-cache
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
