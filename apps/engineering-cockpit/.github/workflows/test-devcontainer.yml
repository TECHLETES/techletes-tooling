name: Test Devcontainer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: devcontainer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer-smoke:
    name: Devcontainer Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create CI environment file
        run: cp .env.template .env

      - name: Prepare host mounts
        run: |
          mkdir -p "$HOME/.codex"
          mkdir -p "$HOME/.config/gh"
          touch "$HOME/.gitconfig"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Create CI Compose cache override
        run: |
          cat > .devcontainer/docker-compose.ci.yml <<'YAML'
          services:
            app:
              build:
                cache_from:
                  - type=gha,scope=full-stack-devcontainer
                cache_to:
                  - type=gha,scope=full-stack-devcontainer,mode=max
          YAML

      - name: Add CI Compose override to devcontainer configuration
        run: |
          jq \
            '.dockerComposeFile = [
              "docker-compose.yml",
              "docker-compose.ci.yml"
            ]' \
            .devcontainer/devcontainer.json \
            > .devcontainer/devcontainer.tmp.json

          mv .devcontainer/devcontainer.tmp.json .devcontainer/devcontainer.json

      - name: Cache Dev Containers metadata
        uses: actions/cache@v4
        with:
          path: .devcontainer-user-data
          key: >-
            devcontainer-user-data-${{ runner.os }}-${{
              hashFiles(
                '.devcontainer/devcontainer.json',
                '.devcontainer/Dockerfile',
                '.devcontainer/docker-compose.yml',
                '.devcontainer/post-create.sh',
                '.devcontainer/initialize.sh',
                'pyproject.toml',
                'uv.lock'
              )
            }}
          restore-keys: |
            devcontainer-user-data-${{ runner.os }}-

      - name: Build and bootstrap devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          userDataFolder: .devcontainer-user-data
          env: |
            DEVCONTAINER_CI=true
          push: never
          runCmd: |
            set -euo pipefail

            test -d .venv
            test -x .git/hooks/pre-commit

            uv --version
            .venv/bin/python --version
