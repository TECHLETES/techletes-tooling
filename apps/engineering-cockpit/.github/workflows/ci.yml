name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - staging
    paths-ignore:
      - 'coverage.svg'

  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'coverage.svg'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  changed_files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      database: ${{ steps.filter.outputs.database }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      pre_commit: ${{ steps.filter.outputs.pre_commit }}
      docker_compose: ${{ steps.filter.outputs.docker_compose }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'uv.lock'
              - '.github/workflows/test-backend.yml'
            database:
              - 'backend/alembic/**'
              - 'backend/alembic.ini'
              - 'backend/core/db.py'
              - 'backend/models.py'
              - 'uv.lock'
              - '.github/workflows/test-database.yml'
            devcontainer:
              - '.devcontainer/**'
              - '.env.template'
              - '.github/workflows/test-devcontainer.yml'
            pre_commit:
              - '.pre-commit-config.yaml'
              - '.secret.baseline'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/**'
              - 'tests/**'
              - '.devcontainer/**'
              - '.github/workflows/test-pre-commit.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'Caddyfile'
              - '.env.template'
            docker_compose:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'Caddyfile'
              - '.env.template'
              - '.github/workflows/test-docker-compose.yml'

  pre-commit:
    uses: ./.github/workflows/test-pre-commit.yml
    if: ${{ needs.changed_files.outputs.ci == 'true' || needs.changed_files.outputs.pre_commit == 'true' }}
    needs: changed_files
    secrets: inherit # pragma: allowlist secret

  test-backend:
    uses: ./.github/workflows/test-backend.yml
    if: ${{ needs.changed_files.outputs.ci == 'true' || needs.changed_files.outputs.backend == 'true' || needs.changed_files.outputs.database == 'true' }}
    needs: changed_files
    secrets: inherit # pragma: allowlist secret

  test-database:
    uses: ./.github/workflows/test-database.yml
    if: ${{ needs.changed_files.outputs.ci == 'true' || needs.changed_files.outputs.database == 'true' }}
    needs: changed_files
    secrets: inherit # pragma: allowlist secret

  test-docker-compose:
    uses: ./.github/workflows/test-docker-compose.yml
    if: ${{ needs.changed_files.outputs.ci == 'true' || needs.changed_files.outputs.backend == 'true' || needs.changed_files.outputs.database == 'true' || needs.changed_files.outputs.frontend == 'true' || needs.changed_files.outputs.docker_compose == 'true' }}
    needs: changed_files
    secrets: inherit # pragma: allowlist secret

  test-devcontainer:
    uses: ./.github/workflows/test-devcontainer.yml
    if: ${{ needs.changed_files.outputs.ci == 'true' || needs.changed_files.outputs.devcontainer == 'true' }}
    needs: changed_files
    secrets: inherit # pragma: allowlist secret
