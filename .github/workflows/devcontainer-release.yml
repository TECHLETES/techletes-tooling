name: Publish shared devcontainer

on:
  push:
    branches:
      - main
    tags:
      - "devcontainer-v*.*.*"
    paths:
      - "devcontainers/standard/**"
      - ".github/workflows/devcontainer-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/techletes/devcontainer
  DEVCONTAINER_CLI_VERSION: 0.89.0
  BUILDX_CACHE_DIR: /tmp/.buildx-cache

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@${DEVCONTAINER_CLI_VERSION}

      - name: Restore BuildKit cache
        id: buildx-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILDX_CACHE_DIR }}
          key: devcontainer-buildx-${{ runner.os }}-amd64-${{ hashFiles('devcontainers/standard/Dockerfile', 'devcontainers/standard/.dockerignore', 'devcontainers/standard/.devcontainer/**', 'devcontainers/standard/scripts/**') }}
          restore-keys: |
            devcontainer-buildx-${{ runner.os }}-amd64-

      - name: Build validation image
        shell: bash
        env:
          BUILDX_CACHE_HIT: ${{ steps.buildx-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail

          cache_args=()
          if [[ -f "${BUILDX_CACHE_DIR}/index.json" ]]; then
            cache_args+=(--cache-from "type=local,src=${BUILDX_CACHE_DIR}")
          fi
          if [[ "${BUILDX_CACHE_HIT}" != "true" ]]; then
            cache_args+=(--cache-to "type=local,dest=${BUILDX_CACHE_DIR}-new,mode=max")
          fi

          devcontainer build \
            --workspace-folder devcontainers/standard \
            --platform linux/amd64 \
            --image-name techletes-devcontainer:release-check \
            "${cache_args[@]}"

          if [[ "${BUILDX_CACHE_HIT}" != "true" ]]; then
            rm -rf "${BUILDX_CACHE_DIR}"
            mv "${BUILDX_CACHE_DIR}-new" "${BUILDX_CACHE_DIR}"
          fi

      - name: Verify shared toolchain
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            techletes-devcontainer:release-check \
            -lc /usr/local/share/techletes/verify-image.sh

      - name: Verify embedded metadata
        run: |
          metadata="$(docker inspect techletes-devcontainer:release-check --format '{{ index .Config.Labels "devcontainer.metadata" }}')"
          test -n "${metadata}"

          grep -Fq 'ms-python.python' <<<"${metadata}"
          grep -Fq 'azure-cli' <<<"${metadata}"
          grep -Fq 'docker-outside-of-docker' <<<"${metadata}"
          grep -Fq 'ms-toolsai.jupyter' <<<"${metadata}"
          grep -Fq 'biomejs.biome' <<<"${metadata}"
          grep -Fq 'bradlc.vscode-tailwindcss' <<<"${metadata}"
          grep -Fq 'ms-playwright.playwright' <<<"${metadata}"
          grep -Fq 'mtxr.sqltools-driver-mysql' <<<"${metadata}"
          grep -Fq 'mtxr.sqltools-driver-pg' <<<"${metadata}"
          grep -Fq 'matthewpi.caddyfile-support' <<<"${metadata}"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@${DEVCONTAINER_CLI_VERSION}

      - name: Restore multi-platform BuildKit cache
        id: buildx-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILDX_CACHE_DIR }}
          key: devcontainer-buildx-${{ runner.os }}-multiarch-${{ hashFiles('devcontainers/standard/Dockerfile', 'devcontainers/standard/.dockerignore', 'devcontainers/standard/.devcontainer/**', 'devcontainers/standard/scripts/**') }}
          restore-keys: |
            devcontainer-buildx-${{ runner.os }}-multiarch-

      - name: Restore validation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILDX_CACHE_DIR }}-amd64
          key: devcontainer-buildx-${{ runner.os }}-amd64-${{ hashFiles('devcontainers/standard/Dockerfile', 'devcontainers/standard/.dockerignore', 'devcontainers/standard/.devcontainer/**', 'devcontainers/standard/scripts/**') }}
          restore-keys: |
            devcontainer-buildx-${{ runner.os }}-amd64-

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          sha_image="${IMAGE}:${short_sha}"
          publish_sha=true
          if docker manifest inspect "${sha_image}" >/dev/null 2>&1; then
            publish_sha=false
            echo "Commit image ${sha_image} already exists; preserving the existing immutable commit tag."
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#devcontainer-v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid devcontainer release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi

            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"

            if docker manifest inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
              echo "Exact image ${IMAGE}:${version} already exists; refusing to overwrite it." >&2
              exit 1
            fi

            {
              echo 'names<<EOF'
              if [[ "${publish_sha}" == "true" ]]; then
                echo "${sha_image}"
              fi
              echo "${IMAGE}:${version}"
              echo "${IMAGE}:${major}.${minor}"
              echo "${IMAGE}:${major}"
              echo "${IMAGE}:latest"
              echo 'EOF'
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo 'names<<EOF'
              if [[ "${publish_sha}" == "true" ]]; then
                echo "${sha_image}"
              fi
              echo "${IMAGE}:edge"
              echo "${IMAGE}:latest"
              echo 'EOF'
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish multi-platform image
        shell: bash
        env:
          IMAGE_NAMES: ${{ steps.tags.outputs.names }}
          BUILDX_CACHE_HIT: ${{ steps.buildx-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail

          image_args=()
          while IFS= read -r image_name; do
            [[ -z "${image_name}" ]] || image_args+=(--image-name "${image_name}")
          done <<<"${IMAGE_NAMES}"

          cache_args=()
          if [[ -f "${BUILDX_CACHE_DIR}/index.json" ]]; then
            cache_args+=(--cache-from "type=local,src=${BUILDX_CACHE_DIR}")
          fi
          if [[ -f "${BUILDX_CACHE_DIR}-amd64/index.json" ]]; then
            cache_args+=(--cache-from "type=local,src=${BUILDX_CACHE_DIR}-amd64")
          fi
          if [[ "${BUILDX_CACHE_HIT}" != "true" ]]; then
            cache_args+=(--cache-to "type=local,dest=${BUILDX_CACHE_DIR}-new,mode=max")
          fi

          devcontainer build \
            --workspace-folder devcontainers/standard \
            --platform "linux/amd64,linux/arm64" \
            --push true \
            "${image_args[@]}" \
            "${cache_args[@]}"

          if [[ "${BUILDX_CACHE_HIT}" != "true" ]]; then
            rm -rf "${BUILDX_CACHE_DIR}"
            mv "${BUILDX_CACHE_DIR}-new" "${BUILDX_CACHE_DIR}"
          fi
