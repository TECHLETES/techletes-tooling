name: Codex plugin checks

on:
  pull_request:
    paths:
      - 'plugins/techletes-superpowers/**'
      - '.github/workflows/codex-plugin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin configuration and handoff behavior
        run: python -m unittest discover -s plugins/techletes-superpowers/tests -v
      - name: Check shell syntax
        run: |
          for script in plugins/techletes-superpowers/skills/subagent-driven-development/scripts/*; do
            bash -n "$script"
          done
      - name: Check patch whitespace
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git diff --check "origin/$BASE_REF"...HEAD
