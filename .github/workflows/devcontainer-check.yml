name: Devcontainer image checks

on:
  pull_request:
    paths:
      - "devcontainers/standard/**"
      - ".github/workflows/devcontainer-check.yml"
      - ".github/workflows/devcontainer-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVCONTAINER_CLI_VERSION: 0.89.0
  BUILDX_CACHE_DIR: /tmp/.buildx-cache

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@${DEVCONTAINER_CLI_VERSION}

      - name: Restore BuildKit cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILDX_CACHE_DIR }}
          key: devcontainer-buildx-${{ runner.os }}-${{ hashFiles('devcontainers/standard/Dockerfile', 'devcontainers/standard/.dockerignore', 'devcontainers/standard/.devcontainer/**', 'devcontainers/standard/scripts/**') }}-${{ github.run_id }}-check
          restore-keys: |
            devcontainer-buildx-${{ runner.os }}-${{ hashFiles('devcontainers/standard/Dockerfile', 'devcontainers/standard/.dockerignore', 'devcontainers/standard/.devcontainer/**', 'devcontainers/standard/scripts/**') }}-
            devcontainer-buildx-${{ runner.os }}-

      - name: Build shared devcontainer
        shell: bash
        run: |
          set -euo pipefail

          cache_args=(
            --cache-to "type=local,dest=${BUILDX_CACHE_DIR}-new,mode=max"
          )
          if [[ -f "${BUILDX_CACHE_DIR}/index.json" ]]; then
            cache_args+=(--cache-from "type=local,src=${BUILDX_CACHE_DIR}")
          fi

          devcontainer build \
            --workspace-folder devcontainers/standard \
            --platform linux/amd64 \
            --image-name techletes-devcontainer:test \
            "${cache_args[@]}"

          rm -rf "${BUILDX_CACHE_DIR}"
          mv "${BUILDX_CACHE_DIR}-new" "${BUILDX_CACHE_DIR}"

      - name: Verify shared toolchain
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            techletes-devcontainer:test \
            -lc /usr/local/share/techletes/verify-image.sh

      - name: Verify embedded Dev Container metadata
        run: |
          metadata="$(docker inspect techletes-devcontainer:test --format '{{ index .Config.Labels "devcontainer.metadata" }}')"
          test -n "${metadata}"

          # Core runtime/features.
          grep -Fq 'ms-python.python' <<<"${metadata}"
          grep -Fq 'azure-cli' <<<"${metadata}"
          grep -Fq 'docker-outside-of-docker' <<<"${metadata}"

          # Representative full-stack editor baseline.
          grep -Fq 'ms-toolsai.jupyter' <<<"${metadata}"
          grep -Fq 'biomejs.biome' <<<"${metadata}"
          grep -Fq 'bradlc.vscode-tailwindcss' <<<"${metadata}"
          grep -Fq 'ms-playwright.playwright' <<<"${metadata}"
          grep -Fq 'mtxr.sqltools-driver-mysql' <<<"${metadata}"
          grep -Fq 'mtxr.sqltools-driver-pg' <<<"${metadata}"
          grep -Fq 'matthewpi.caddyfile-support' <<<"${metadata}"
